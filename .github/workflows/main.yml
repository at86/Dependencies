on:
  workflow_dispatch:
  push:
    branches:
    - main
    tags:
    - '*'

permissions:
  contents: read

name: Main
jobs:
  build-windows:
    name: windows ${{matrix.architecture}} ${{matrix.buildType}} ${{matrix.openmp}} ${{matrix.all == true && 'all' || ''}} ${{matrix.linkRuntime == true && 'linked runtime' || ''}}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        architecture: [ x64 ]
        buildType: [ static ]
        openmp: [ OpenMP ]
        all: [ false ]
        linkRuntime: [ true ]
        exclude:
          - buildType: dynamic
            linkRuntime: true
          - all: true
            linkRuntime: true

    env:
      ARTIFACT_NAME: windows-${{matrix.architecture}}-${{matrix.buildType}}-${{matrix.openmp}}${{matrix.all == true && '-all' || ''}}${{matrix.linkRuntime == true && '-linked-runtime' || ''}}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false

      - name: Download configure
        shell: cmd
        run: |
          .github\build\windows\download-configure.cmd

      - name: Clone dependencies
        shell: cmd
        run: clone-dependencies.cmd

      - name: Run configure
        shell: cmd
        working-directory: Configure
        run: |
          Configure.Release.x64.exe /noWizard /VS2022 /${{matrix.architecture}} /${{matrix.buildType}} /${{matrix.openmp}} ${{matrix.all == true && '/includeOptional /incompatibleLicense' || ''}} ${{matrix.linkRuntime == true && '/linkRuntime /includeNonWindows' || ''}}

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat"
          msbuild IM7.${{matrix.buildType}}.${{matrix.architecture}}.sln /verbosity:minimal /m /t:Rebuild /p:Configuration=Release,Platform=${{matrix.architecture}}

      - name: Generate SBOM
        shell: cmd
        run: python .github\build\shared\generate-sbom.py Artifacts\sbom.json

      - name: Prepare artifacts
        shell: cmd
        run: |
          del "Artifacts\bin\*.pdb" /Q 2>nul
          del "Artifacts\lib\*.pdb" /Q 2>nul
          for %%F in ("Artifacts\lib\*.lib") do (
            echo %%~nxF >> "Artifacts\pre-build-libs.txt"
          )
          powershell -Command "Compress-Archive -Path 'Artifacts\*' -DestinationPath '${{ env.ARTIFACT_NAME }}.zip'"

      - name: Upload artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f #v7.0.0
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_NAME }}.zip

  release:
    name: Create release
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    needs:
      - build-windows

    permissions:
      attestations: write
      id-token: write

    env:
      VERSION: ${{github.ref_name}}

    steps:
      - name: Create GitHub app token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 #v3.3.0
        id: app-token
        with:
          client-id: ${{vars.APP_CLIENT_ID}}
          private-key: ${{secrets.APP_PRIVATE_KEY}}
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 #v8.0.2
        name: Download artifacts
        with:
          path: ${{ github.workspace }}/Artifacts
          merge-multiple: true

      - name: Generate SLSA provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 #v4.2.2
        with:
          subject-path: ${{github.workspace}}\Artifacts\*.zip

      - name: Save provenance as multiple.intoto.jsonl
        shell: bash
        run: |
          cp "${{steps.attest.outputs.bundle-path}}" "${{github.workspace}}/multiple.intoto.jsonl"

      - name: Publish release
        shell: cmd
        env:
          GH_TOKEN: ${{steps.app-token.outputs.token}}
        run: |
          gh release create %VERSION% ^
            --verify-tag ^
            --title "%VERSION%" ^
            --notes "%VERSION%" ^
            ${{github.workspace}}\Artifacts\*.zip ^
            ${{github.workspace}}\multiple.intoto.jsonl
