on:
  workflow_dispatch:
  push:
    branches:
    - main

permissions:
  contents: read

name: Create release
jobs:
  build-windows:
    name: windows ${{matrix.architecture}} ${{matrix.buildType}} ${{matrix.openmp}} ${{matrix.all == true && 'all' || ''}} ${{matrix.linkRuntime == true && 'linked runtime' || ''}}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        architecture: [ x64 ]
        buildType: [ static ]
        openmp: [ OpenMP ]
        all: [ false ]
        linkRuntime: [ true ]
        exclude:
          - buildType: dynamic
            linkRuntime: true
          - all: true
            linkRuntime: true

    env:
      ARTIFACT_NAME: windows-${{matrix.architecture}}-${{matrix.buildType}}-${{matrix.openmp}}${{matrix.all == true && '-all' || ''}}${{matrix.linkRuntime == true && '-linked-runtime' || ''}}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0
        with:
          persist-credentials: false

      - name: Download configure
        shell: cmd
        run: |
          .github\build\windows\download-configure.cmd

      - name: Clone dependencies
        shell: cmd
        run: clone-dependencies.cmd

      - name: Run configure
        shell: cmd
        working-directory: Configure
        run: |
          Configure.Release.x64.exe /noWizard /VS2022 /${{matrix.architecture}} /${{matrix.buildType}} /${{matrix.openmp}} ${{matrix.all == true && '/includeOptional /incompatibleLicense' || ''}} ${{matrix.linkRuntime == true && '/linkRuntime /includeNonWindows' || ''}}

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat"
          msbuild IM7.${{matrix.buildType}}.${{matrix.architecture}}.sln /verbosity:minimal /m /t:Rebuild /p:Configuration=Release,Platform=${{matrix.architecture}}

      - name: Prepare artifacts
        shell: cmd
        run: |
          del "Artifacts\bin\*.pdb" /Q 2>nul
          del "Artifacts\lib\*.pdb" /Q 2>nul
          for %%F in ("Artifacts\lib\*.lib") do (
            echo %%~nxF >> "Artifacts\pre-build-libs.txt"
          )
          powershell -Command "Compress-Archive -Path 'Artifacts\*' -DestinationPath '${{ env.ARTIFACT_NAME }}.zip'"

      - name: Upload artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f #v7.0.0
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_NAME }}.zip

  release:
    name: Create release
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    needs:
      - build-windows

    permissions:
      attestations: write
      id-token: write

    steps:
      - name: Create GitHub app token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 #v3.2.0
        id: app-token
        with:
          client-id: ${{vars.APP_CLIENT_ID}}
          private-key: ${{secrets.APP_PRIVATE_KEY}}
          permission-contents: write

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0
        with:
          token: ${{steps.app-token.outputs.token}}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        name: Download artifacts
        with:
          path: ${{ github.workspace }}/Artifacts
          merge-multiple: true

      - name: Generate SLSA provenance
        id: attest
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 #v4.1.1
        with:
          subject-path: ${{github.workspace}}\Artifacts\*.zip

      - name: Save provenance as multiple.intoto.jsonl
        shell: bash
        run: |
          cp "${{steps.attest.outputs.bundle-path}}" "${{github.workspace}}/multiple.intoto.jsonl"

      - name: Set version
        shell: bash
        run: echo "VERSION=$(date +'%Y.%m.%d.%H%M')" >> $GITHUB_ENV

      - name: Create and push tag
        shell: bash
        run: |
          git config --global user.name '${{steps.app-token.outputs.app-slug}}[bot]'
          git config --global user.email '${{vars.APP_USER_ID}}+${{steps.app-token.outputs.app-slug}}[bot]@users.noreply.github.com'
          git tag $VERSION
          git push origin $VERSION

      - name: Publish release
        shell: cmd
        env:
          GH_TOKEN: ${{steps.app-token.outputs.token}}
        run: |
          gh release create %VERSION% ^
            --title "%VERSION%" ^
            --notes "%VERSION%" ^
            ${{github.workspace}}\Artifacts\*.zip ^
            ${{github.workspace}}\multiple.intoto.jsonl
